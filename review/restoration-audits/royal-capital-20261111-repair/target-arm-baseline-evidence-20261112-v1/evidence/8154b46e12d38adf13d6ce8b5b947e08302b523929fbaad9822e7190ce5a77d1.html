<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Native repair playback verification</title>
<style>body{margin:0;background:#202027;color:white;font:15px sans-serif}header{padding:8px}button{margin-right:12px}iframe{border:0;width:100%;height:930px}</style>
<header><button id="advance">继续</button><button id="zh">中文</button><span id="state">准备中</span></header>
<iframe id="storyPreview" src="/player/player.html?embedded=1"></iframe>
<script>
const frame=document.querySelector('iframe'),query=new URLSearchParams(location.search);
const send=data=>frame.contentWindow.postMessage(data,location.origin);
window.messageHistory=[];window.latestPlayerState=null;
window.addEventListener('message',async event=>{
  if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
  messageHistory.push(event.data);if(messageHistory.length>150)messageHistory.shift();
  if(event.data.type==='stella-player-ready'){
    const program=await fetch('/program?'+query).then(response=>response.json());
    window.previewSummary={start:program.start,nodes:program.nodes.length,edges:program.edges.length,directory:program.directory};
    send({type:'stella-player-load',program});send({type:'stella-player-action',action:'language',value:'zh'});
  }
  if(event.data.type==='stella-player-state'){
    window.latestPlayerState=event.data.state;document.querySelector('#state').textContent=event.data.state.status;
  }
});
document.querySelector('#advance').onclick=()=>send({type:'stella-player-action',action:'advance'});
document.querySelector('#zh').onclick=()=>send({type:'stella-player-action',action:'language',value:'zh'});
</script></html>
